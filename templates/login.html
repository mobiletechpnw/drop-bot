<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        var accents = ['sunset', 'ocean', 'emerald', 'ruby', 'gold', 'grape', 'slate'];
        var a = localStorage.getItem('accent');
        document.documentElement.setAttribute('data-accent', accents.indexOf(a) === -1 ? 'sunset' : a);
      } catch (e) {}
    })();
  </script>
  <meta name="theme-color" content="#0b0b10">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🛒</text></svg>">
  <title>Sign in · Drop Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;550;600;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_ver }}">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>🛒 Drop Bot</h1>
    <p class="muted">Enter your server's access key to manage its drops.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="key">Access key</label>
      <input type="password" id="key" name="key" autocomplete="off"
             autofocus placeholder="Paste the key from !webkey">
      <button type="submit">Sign in</button>
    </form>
    <p class="muted small">
      Get a key by running <code>!webkey</code> in your Discord server
      (managers only). It will be DM'd to you.
    </p>
  </div>
</body>
</html>
